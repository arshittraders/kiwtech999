<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Kiara — Kiwtech Assistant</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  
  :root {
    --brand: #6C47FF;
    --brand2: #ff2d78;
    --dark: #0d1424;
    --bg: #f4f6ff;
    --white: #fff;
    --text: #1a1a2e;
    --muted: #6b7280;
    --border: #e2e5f5;
    --bubble-ai: #fff;
    --bubble-user: #6C47FF;
    --green: #25d366;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #0d1424, #1a1040);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  }
  .avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    position: relative;
  }
  .avatar::after {
    content: '';
    position: absolute;
    bottom: 2px; right: 2px;
    width: 10px; height: 10px;
    background: #22c55e;
    border-radius: 50%;
    border: 2px solid #0d1424;
  }
  .header-info { flex: 1; }
  .header-name { font-size: 15px; font-weight: 800; color: #fff; }
  .header-sub { font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 1px; }
  .header-logo {
    font-size: 13px; font-weight: 900; color: #fff;
    background: #fff200; color: #000; padding: 2px 7px; border-radius: 5px;
  }

  /* MESSAGES */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }

  .msg { display: flex; gap: 8px; max-width: 88%; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.ai { align-self: flex-start; }

  .msg-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; margin-top: 2px;
  }

  .bubble {
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.55;
    max-width: 100%;
  }
  .msg.ai .bubble {
    background: var(--bubble-ai);
    color: var(--text);
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .msg.user .bubble {
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .msg-time { font-size: 10px; color: var(--muted); margin-top: 3px; padding: 0 4px; }
  .msg.user .msg-time { text-align: right; }

  /* TYPING */
  .typing { display: flex; gap: 4px; align-items: center; padding: 12px 14px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--brand); opacity: 0.4;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-5px);opacity:1} }

  /* QUICK REPLIES */
  .quick-replies {
    display: flex; flex-wrap: wrap; gap: 7px;
    padding: 0 14px 10px;
    flex-shrink: 0;
  }
  .qr {
    padding: 7px 13px;
    border: 1.5px solid var(--brand);
    border-radius: 20px;
    font-size: 12px; font-weight: 600;
    color: var(--brand);
    background: #fff;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .qr:hover, .qr:active { background: var(--brand); color: #fff; }

  /* INPUT */
  .input-area {
    background: #fff;
    border-top: 1.5px solid var(--border);
    padding: 10px 12px;
    display: flex; gap: 8px; align-items: flex-end;
    flex-shrink: 0;
  }
  .input-wrap { flex: 1; position: relative; }
  textarea {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 22px;
    padding: 10px 16px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    max-height: 100px;
    line-height: 1.4;
    transition: border 0.2s;
    background: var(--bg);
  }
  textarea:focus { border-color: var(--brand); background: #fff; }
  
  .send-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--brand);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .send-btn:hover { background: #5535e0; }
  .send-btn:disabled { background: var(--border); }

  /* WA BUTTON */
  .wa-btn {
    display: flex; align-items: center; gap: 8px;
    background: var(--green);
    color: #fff;
    padding: 9px 14px;
    border-radius: 12px;
    font-size: 13px; font-weight: 700;
    text-decoration: none;
    margin-top: 6px;
    width: fit-content;
  }

  .scrollbar-thin::-webkit-scrollbar { width: 4px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<div class="header">
  <div class="avatar">👩‍💼</div>
  <div class="header-info">
    <div class="header-name">Kiara</div>
    <div class="header-sub">Kiwtech Assistant • Online</div>
  </div>
  <div class="header-logo">KIWTECH</div>
</div>

<div class="messages scrollbar-thin" id="msgs"></div>

<div class="quick-replies" id="qr-area"></div>

<div class="input-area">
  <div class="input-wrap">
    <textarea id="inp" placeholder="Kuch bhi poochho..." rows="1"></textarea>
  </div>
  <button class="send-btn" id="send-btn" onclick="sendMsg()">➤</button>
</div>

<script>
const WA_LINK = "https://wa.me/918377065737";
const OPENAI_KEY = ""; // Vercel API se call karenge

// Conversation history
let history = [];
let isTyping = false;

const SYSTEM_PROMPT = `Tu Kiara hai — Kiwtech ki sales aur support assistant. Kiwtech ek Indian e-commerce growth company hai jo Meesho, Amazon aur Flipkart sellers ki help karta hai.

KIWTECH KI SERVICES:
1. Kiwtech Meesho Research Tool (Chrome Extension)
   - AI Listing Generator (GPT-4o se)
   - Keyword Rank Checker
   - Smart Auto-Fill Form
   - Competitor Research
   - Visual Search
   - PRICE: Monthly ₹499, 3 Month ₹999, Yearly ₹3,999
   - Free demo available (email se)
   - Link: kiwtech.in/tools.html

2. Kiwtech Shipping Optimizer (Chrome Extension)
   - Meesho shipping ₹30-50 tak kam karta hai
   - 200 image variations scan karta hai
   - Auto apply to panel
   - 10 free credits on install
   - PRICE: 50 credits ₹50, 150 credits ₹120, 300 credits ₹220, Unlimited Monthly ₹299
   - Link: kiwtech.in/tools.html

3. Account Management Services
   - Meesho, Amazon, Flipkart store management
   - AI listings, SEO, images, ads
   - Custom pricing (WhatsApp pe poochho)

CONTACT: WhatsApp 8377065737, kiwtech.in

RULES:
- Hamesha chhote, natural replies de — 2-4 lines max
- Human jaisi baat kar — "Ji haan", "Bilkul", "Acha", "Haan bhai" jaisi language use kar
- Hindi, English, Hinglish — jo bhi user use kare wahi use kar
- Kiwtech ke baare mein hi baat kar
- Price pooche toh seedha batao
- Agar kuch nahi samajh aaye ya user baat karna chahe toh WhatsApp suggest karo: wa.me/918377065737
- Kabhi mat batao ki tu AI hai jab tak seedha na poochhe
- Sales ke liye encourage karo lekin pressure mat dalo
- "Demo try karo" ya "WhatsApp karo" suggest karo closing mein`;

function getTime() {
  return new Date().toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
}

function addMsg(text, role, extra='') {
  const msgs = document.getElementById('msgs');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  
  const avatarHtml = role === 'ai' 
    ? `<div class="msg-avatar">👩‍💼</div>` 
    : '';

  div.innerHTML = `
    ${avatarHtml}
    <div>
      <div class="bubble">${text}</div>
      ${extra}
      <div class="msg-time">${getTime()}</div>
    </div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById('msgs');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing-indicator';
  div.innerHTML = `
    <div class="msg-avatar">👩‍💼</div>
    <div class="bubble" style="padding:10px 14px;">
      <div class="typing"><span></span><span></span><span></span></div>
    </div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function setQuickReplies(qrs) {
  const area = document.getElementById('qr-area');
  area.innerHTML = '';
  qrs.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'qr';
    btn.textContent = q;
    btn.onclick = () => {
      document.getElementById('inp').value = q;
      sendMsg();
    };
    area.appendChild(btn);
  });
}

async function callAI(userMsg) {
  history.push({ role: 'user', content: userMsg });

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 300,
        system: SYSTEM_PROMPT,
        messages: history
      })
    });

    const data = await res.json();
    const reply = data.content?.[0]?.text || 'Ek second... dobara try karo!';
    history.push({ role: 'assistant', content: reply });
    return reply;

  } catch(e) {
    return 'Network issue aa gaya! WhatsApp pe contact karo 😊';
  }
}

async function sendMsg() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text || isTyping) return;

  inp.value = '';
  inp.style.height = 'auto';
  document.getElementById('qr-area').innerHTML = '';
  isTyping = true;
  document.getElementById('send-btn').disabled = true;

  addMsg(text, 'user');
  showTyping();

  const reply = await callAI(text);
  
  // Small delay for natural feel
  await new Promise(r => setTimeout(r, 400));
  removeTyping();

  // Check if WhatsApp should be suggested
  const needsWA = reply.toLowerCase().includes('whatsapp') || 
                  reply.toLowerCase().includes('contact') ||
                  history.length > 12;
  
  const waExtra = needsWA 
    ? `<a href="${WA_LINK}?text=${encodeURIComponent('Hi Kiwtech! Mujhe help chahiye.')}" target="_blank" class="wa-btn">💬 WhatsApp pe baat karo</a>` 
    : '';

  addMsg(reply.replace(/\n/g, '<br>'), 'ai', waExtra);

  // Smart quick replies based on conversation
  if (history.length <= 4) {
    setQuickReplies(['Shipping Optimizer kya hai?', 'Research Tool price?', 'Free demo chahiye', 'Account management?']);
  } else if (history.length <= 8) {
    setQuickReplies(['Buy karna hai', 'Demo try karna hai', 'WhatsApp pe baat karo']);
  }

  isTyping = false;
  document.getElementById('send-btn').disabled = false;
}

// Enter to send
document.getElementById('inp').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});

// Auto resize textarea
document.getElementById('inp').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

// Welcome message
setTimeout(() => {
  addMsg('Namaste! 👋 Main Kiara hun, Kiwtech ki assistant.<br><br>Aapki kya help kar sakti hun? Shipping Optimizer, Research Tool, ya account management — kuch bhi poochho!', 'ai');
  setQuickReplies(['Shipping Optimizer kya hai?', 'Research Tool kya hai?', 'Pricing batao', 'Free demo chahiye']);
}, 500);
</script>
</body>
</html>
