<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Kiara — Kiwtech Assistant</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --brand: #6C47FF;
    --brand2: #ff2d78;
    --dark: #0d1424;
    --bg: #f4f6ff;
    --white: #fff;
    --text: #1a1a2e;
    --muted: #6b7280;
    --border: #e2e5f5;
    --green: #25d366;
  }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    height: 100dvh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #0d1424, #1a1040);
    padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0; position: relative;
  }
  .avatar::after {
    content: ''; position: absolute; bottom: 2px; right: 2px;
    width: 11px; height: 11px; background: #22c55e;
    border-radius: 50%; border: 2px solid #0d1424;
  }
  .header-info { flex: 1; }
  .header-name { font-size: 15px; font-weight: 800; color: #fff; }
  .header-sub { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 1px; }
  .header-logo { font-size: 12px; font-weight: 900; background: #fff200; color: #000; padding: 3px 8px; border-radius: 5px; }

  .messages {
    flex: 1; overflow-y: auto; padding: 14px 12px;
    display: flex; flex-direction: column; gap: 10px;
    scroll-behavior: smooth;
  }
  .msg { display: flex; gap: 8px; max-width: 90%; animation: pop 0.2s ease; }
  @keyframes pop { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.ai { align-self: flex-start; }
  .msg-av {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; margin-top: 2px;
  }
  .bubble {
    padding: 10px 14px; border-radius: 18px;
    font-size: 14px; line-height: 1.55;
  }
  .msg.ai .bubble {
    background: #fff; color: var(--text);
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .msg.user .bubble {
    background: var(--brand); color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg-time { font-size: 10px; color: var(--muted); margin-top: 3px; padding: 0 4px; }
  .msg.user .msg-time { text-align: right; }

  .typing { display:flex; gap:4px; align-items:center; padding:12px 14px; }
  .typing span {
    width:7px; height:7px; border-radius:50%;
    background:var(--brand); opacity:0.4;
    animation:bounce 1.2s infinite;
  }
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}

  .quick-replies {
    display:flex; flex-wrap:wrap; gap:7px;
    padding: 4px 12px 8px; flex-shrink:0;
  }
  .qr {
    padding:7px 13px; border:1.5px solid var(--brand);
    border-radius:20px; font-size:12px; font-weight:600;
    color:var(--brand); background:#fff; cursor:pointer;
    transition:all .15s; white-space:nowrap;
  }
  .qr:active{background:var(--brand);color:#fff}

  .input-area {
    background:#fff; border-top:1.5px solid var(--border);
    padding:10px 12px; display:flex; gap:8px; align-items:flex-end;
    flex-shrink:0;
  }
  textarea {
    flex:1; border:1.5px solid var(--border); border-radius:22px;
    padding:10px 16px; font-size:14px; font-family:inherit;
    resize:none; outline:none; max-height:90px; line-height:1.4;
    background:var(--bg); transition:border .2s;
  }
  textarea:focus{border-color:var(--brand);background:#fff}
  .send-btn {
    width:42px; height:42px; border-radius:50%;
    background:var(--brand); border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; flex-shrink:0; color:#fff;
    transition:background .2s;
  }
  .send-btn:disabled{background:var(--border)}

  .wa-card {
    background: linear-gradient(135deg, #25d366, #128c7e);
    border-radius: 14px; padding: 14px 16px; margin-top: 6px;
  }
  .wa-card-title { font-size: 13px; font-weight: 800; color: #fff; margin-bottom: 4px; }
  .wa-card-sub { font-size: 11px; color: rgba(255,255,255,0.8); margin-bottom: 10px; }
  .wa-card a {
    display:block; text-align:center; padding:9px;
    background:#fff; color:#128c7e; font-size:13px; font-weight:900;
    border-radius:9px; text-decoration:none;
  }

  .pay-card {
    background: linear-gradient(135deg, #f0f4ff, #e8edff);
    border: 2px solid var(--brand); border-radius: 14px;
    padding: 14px 16px; margin-top: 6px;
  }
  .pay-card-title { font-size: 13px; font-weight: 800; color: var(--brand); margin-bottom: 8px; }
  .pay-card a {
    display:block; text-align:center; padding:10px;
    background:var(--brand); color:#fff; font-size:13px; font-weight:900;
    border-radius:9px; text-decoration:none; margin-bottom:6px;
  }

  ::-webkit-scrollbar{width:3px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<div class="header">
  <div class="avatar">👩‍💼</div>
  <div class="header-info">
    <div class="header-name">Kiara</div>
    <div class="header-sub">Kiwtech Sales Executive • Online</div>
  </div>
  <div class="header-logo">KIW<span style="background:#0d1424;color:#fff200;padding:1px 3px;border-radius:2px;">TECH</span></div>
</div>

<div class="messages" id="msgs"></div>
<div class="quick-replies" id="qr-area"></div>

<div class="input-area">
  <textarea id="inp" placeholder="Kuch bhi poochho..." rows="1"></textarea>
  <button class="send-btn" id="send-btn" onclick="sendMsg()">➤</button>
</div>

<script>
const WA_NUMBER = "918377065737";
const API_URL = "https://kiwtech999.vercel.app/api/kiara";

let history = [];
let isTyping = false;
let msgCount = 0;
let lastUserQuery = '';

function getTime() {
  return new Date().toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
}

function addMsg(text, role, extraHTML = '') {
  const msgs = document.getElementById('msgs');
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  // Parse payment links in text
  let displayText = text
    .replace(/\n/g, '<br>')
    .replace(/(https:\/\/rzp\.io\/[^\s<]+)/g, '<a href="$1" target="_blank" style="color:inherit;text-decoration:underline;">$1</a>');

  const avHtml = role === 'ai' ? `<div class="msg-av">👩‍💼</div>` : '';

  div.innerHTML = `${avHtml}<div>
    <div class="bubble">${displayText}</div>
    ${extraHTML}
    <div class="msg-time">${getTime()}</div>
  </div>`;

  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById('msgs');
  const div = document.createElement('div');
  div.className = 'msg ai'; div.id = 'typing-ind';
  div.innerHTML = `<div class="msg-av">👩‍💼</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-ind');
  if (el) el.remove();
}

function setQR(qrs) {
  const area = document.getElementById('qr-area');
  area.innerHTML = '';
  qrs.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'qr'; btn.textContent = q;
    btn.onclick = () => { document.getElementById('inp').value = q; sendMsg(); };
    area.appendChild(btn);
  });
}

function makeWACard(query) {
  const waMsg = encodeURIComponent(`Hi Kiara! Mujhe help chahiye.\n\nMeri query: ${query}`);
  return `<div class="wa-card">
    <div class="wa-card-title">💬 Expert Se Seedha Baat Karo</div>
    <div class="wa-card-sub">Koi bhi doubt — Himanshu personally reply karega</div>
    <a href="https://wa.me/${WA_NUMBER}?text=${waMsg}" target="_blank">📱 WhatsApp Pe Chat Karo →</a>
  </div>`;
}

async function sendMsg() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text || isTyping) return;

  lastUserQuery = text;
  inp.value = ''; inp.style.height = 'auto';
  document.getElementById('qr-area').innerHTML = '';
  isTyping = true;
  document.getElementById('send-btn').disabled = true;
  msgCount++;

  addMsg(text, 'user');
  history.push({ role: 'user', content: text });
  showTyping();

  await new Promise(r => setTimeout(r, 600 + Math.random() * 400));

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    const data = await res.json();
    let reply = data.reply || 'Ek second... dobara try karo!';

    removeTyping();

    // Check for WhatsApp escalation tag
    if (reply.includes('WHATSAPP_ESCALATE:')) {
      const query = reply.replace('WHATSAPP_ESCALATE:', '').trim() || lastUserQuery;
      
      // Send query to owner's WhatsApp automatically via notif
      const ownerMsg = encodeURIComponent(`🔔 Kiara Chatbot Lead:\n\nQuery: ${query}\n\nTime: ${new Date().toLocaleString('en-IN')}`);
      
      addMsg('Aapki query thodi complex hai — main aapko directly expert se connect karti hun! 😊', 'ai', makeWACard(query));
      
      // Auto-ping owner (silent)
      fetch(`https://wa.me/${WA_NUMBER}?text=${ownerMsg}`, { mode: 'no-cors' }).catch(() => {});
      
      setQR(['WhatsApp pe baat karo', 'Aur kuch poochna hai?']);
    } else {
      history.push({ role: 'assistant', content: reply });

      // Check if payment link is in reply
      const hasPayLink = reply.includes('rzp.io');
      const extraHTML = hasPayLink ? '' : '';

      addMsg(reply, 'ai', extraHTML);

      // Smart QR based on stage
      if (msgCount === 1) {
        setQR(['Meesho seller hun', 'Amazon pe hun', 'Shipping problem hai', 'Listing mein time lagta hai']);
      } else if (msgCount <= 3) {
        setQR(['Kitna cost aayega?', 'Free trial hai?', 'Kaise kaam karta hai?', 'Results kya milenge?']);
      } else if (msgCount <= 6) {
        setQR(['Buy karna hai', 'Demo try karna hai', 'Aur batao', 'WhatsApp pe baat karo']);
      } else {
        setQR(['Buy karna hai ✅', 'WhatsApp pe baat karo']);
      }
    }
  } catch(e) {
    removeTyping();
    addMsg('Thodi technical dikkat hai! Seedha WhatsApp karo 😊', 'ai', makeWACard(lastUserQuery));
  }

  isTyping = false;
  document.getElementById('send-btn').disabled = false;
}

// Enter to send
document.getElementById('inp').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});

// Auto resize
document.getElementById('inp').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 90) + 'px';
});

// Welcome
setTimeout(() => {
  addMsg('Namaste! 👋 Main Kiara hun Kiwtech se.<br><br>Kaunsa platform use karte ho — Meesho, Amazon ya Flipkart?', 'ai');
  setQR(['Meesho seller hun', 'Amazon pe hun', 'Flipkart pe hun', 'Sab pe hun']);
}, 600);
</script>
</body>
</html>
