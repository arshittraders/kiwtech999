<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Kiwtech Tools — Meesho Seller Chrome Extension</title>
<meta name="description" content="Kiwtech Meesho Research Tool — AI listing, rank check, auto-fill, shipping optimizer. Free 1-day demo."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f4f6ff;--white:#ffffff;--border:#e2e5f5;--text:#0d1424;--muted:#6b7280;
  --ny:#fff200;--np:#ff2d78;--nb:#00d4ff;--ng:#39ff14;--no:#ff6b00;--nv:#a855f7;
  --meesho:#f43397;--amazon:#ff9900;--flipkart:#2874f0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 500px 380px at 8% 18%,rgba(255,242,0,.18) 0%,transparent 70%),
    radial-gradient(ellipse 420px 340px at 88% 12%,rgba(0,212,255,.14) 0%,transparent 70%),
    radial-gradient(ellipse 460px 360px at 50% 65%,rgba(255,45,120,.09) 0%,transparent 70%),
    radial-gradient(ellipse 360px 300px at 3% 82%,rgba(57,255,20,.09) 0%,transparent 70%)
}
/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:66px;background:rgba(255,255,255,.93);backdrop-filter:blur(20px);border-bottom:1.5px solid var(--border)}
.nav-logo{font-size:22px;font-weight:900;color:var(--text);text-decoration:none;letter-spacing:-.5px}
.nav-logo span{background:var(--ny);padding:2px 8px;border-radius:5px;color:#000}
.nav-links{display:flex;gap:28px;list-style:none}
.nav-links a{color:var(--muted);font-size:14px;font-weight:600;text-decoration:none;transition:color .2s}
.nav-links a:hover{color:var(--text)}
.nav-back{padding:9px 22px;background:var(--text);color:#fff;font-size:13px;font-weight:800;border:none;border-radius:8px;cursor:pointer;text-decoration:none;transition:all .2s}
.nav-back:hover{background:var(--np)}
/* HERO */
.hero{min-height:80vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:120px 20px 60px;position:relative;overflow:hidden}
.hb{position:absolute;border-radius:24px;pointer-events:none;filter:blur(1px)}
.hb1{width:220px;height:140px;background:var(--ny);top:15%;left:4%;transform:rotate(-7deg);opacity:.2}
.hb2{width:180px;height:120px;background:var(--nb);top:20%;right:6%;transform:rotate(5deg);opacity:.18}
.hero-inner{position:relative;z-index:1;max-width:780px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:7px 18px;background:var(--ny);border-radius:100px;font-size:12px;font-weight:900;color:#000;letter-spacing:.5px;margin-bottom:24px}
h1{font-size:clamp(38px,6vw,68px);font-weight:900;line-height:1.06;letter-spacing:-2px;color:var(--text);margin-bottom:18px}
.hy{background:var(--ny);padding:1px 8px;border-radius:5px;display:inline;color:#000}
.hp{background:var(--np);padding:1px 8px;border-radius:5px;display:inline;color:#fff}
.hero-sub{font-size:clamp(14px,2vw,17px);color:var(--muted);font-weight:500;max-width:540px;margin:0 auto 32px;line-height:1.7}
.hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-p{padding:15px 36px;background:var(--text);color:#fff;font-size:15px;font-weight:800;border:none;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block;transition:all .2s}
.btn-p:hover{background:var(--np);transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,45,120,.3)}
.btn-y{padding:15px 36px;background:var(--ny);color:#000;font-size:15px;font-weight:800;border:none;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block;transition:all .2s}
.btn-y:hover{background:#ffe000;transform:translateY(-2px)}
/* SECTION HELPERS */
section{position:relative;z-index:1}
.slabel{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;background:var(--ny);border-radius:100px;font-size:11px;font-weight:900;color:#000;letter-spacing:1px;text-transform:uppercase;margin-bottom:16px}
h2{font-size:clamp(26px,4vw,42px);font-weight:900;line-height:1.1;margin-bottom:12px;letter-spacing:-1px;color:var(--text)}
.ssub{font-size:16px;color:var(--muted);font-weight:500}
.fu{opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .6s ease}
.fu.vis{opacity:1;transform:translateY(0)}
/* FEATURES GRID */
#features{padding:80px 20px;background:var(--white)}
.fgrid{max-width:1100px;margin:48px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.fcard{background:var(--bg);border:2px solid var(--border);border-radius:18px;padding:26px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.fcard:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,.07)}
.fcard::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px}
.fcard:nth-child(1)::after{background:var(--ny)}
.fcard:nth-child(2)::after{background:var(--np)}
.fcard:nth-child(3)::after{background:var(--nb)}
.fcard:nth-child(4)::after{background:var(--ng)}
.fcard:nth-child(5)::after{background:var(--no)}
.fcard:nth-child(6)::after{background:var(--nv)}
.fnum{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:2px;margin-bottom:10px}
.ftitle{font-size:16px;font-weight:800;margin-bottom:8px;color:var(--text)}
.fdesc{font-size:13px;color:var(--muted);line-height:1.65;font-weight:500}
/* PRICING */
#pricing{padding:80px 20px;background:var(--bg)}
.pw{max-width:900px;margin:0 auto}
.phead{text-align:center;margin-bottom:48px}
.pcards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.pcard{background:var(--white);border:2px solid var(--border);border-radius:20px;padding:28px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.pcard:hover{transform:translateY(-5px);box-shadow:0 20px 40px rgba(0,0,0,.09)}
.pcard::before{content:'';position:absolute;top:0;left:0;right:0;height:4px}
.pcard.demo::before{background:var(--nb)}
.pcard.monthly::before{background:var(--np)}
.pcard.lifetime::before{background:var(--ny)}
.pcard.featured{border-color:var(--np)}
.feat-rib{position:absolute;top:16px;right:16px;background:var(--ny);color:#000;font-size:10px;font-weight:900;padding:4px 12px;border-radius:100px}
.plan-name{font-size:18px;font-weight:900;margin-bottom:6px;color:var(--text)}
.plan-price{font-size:42px;font-weight:900;letter-spacing:-1px;line-height:1;margin-bottom:4px}
.plan-price.blue{color:var(--nb)}
.plan-price.pink{color:var(--np)}
.plan-price.gold{color:#b8860b}
.plan-sub{font-size:12px;color:var(--muted);margin-bottom:18px;font-weight:600}
.plan-feats{list-style:none;margin-bottom:22px}
.plan-feats li{padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;font-weight:500;display:flex;gap:8px}
.plan-feats li:last-child{border-bottom:none}
.plan-btn{width:100%;padding:13px;font-size:14px;font-weight:900;border:none;border-radius:10px;cursor:pointer;text-decoration:none;display:block;text-align:center;transition:all .2s}
.plan-btn.blue{background:rgba(0,212,255,.15);color:#0092aa;border:2px solid var(--nb)}
.plan-btn.blue:hover{background:var(--nb);color:#000}
.plan-btn.pink{background:var(--np);color:#fff}
.plan-btn.pink:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(255,45,120,.35)}
.plan-btn.gold{background:var(--ny);color:#000}
.plan-btn.gold:hover{background:#ffe000;transform:translateY(-1px)}
/* DEMO FORM */
#demo{padding:80px 20px;background:var(--white)}
.di{max-width:520px;margin:0 auto;text-align:center}
.dcard{background:var(--bg);border:2px solid var(--border);border-radius:20px;padding:44px 40px;margin-top:40px;position:relative;overflow:hidden}
.dcard::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:var(--ny)}
.dhlt{display:inline-block;background:var(--ny);padding:2px 10px;border-radius:6px;font-size:26px;font-weight:900;color:#000;margin-bottom:10px}
.dsub{font-size:14px;color:var(--muted);margin-bottom:24px;line-height:1.6;font-weight:500}
.dinput{width:100%;padding:14px 18px;background:var(--white);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;font-family:'Plus Jakarta Sans',sans-serif;outline:none;transition:border-color .2s;margin-bottom:14px}
.dinput:focus{border-color:var(--np)}
.dbtn{width:100%;padding:15px;background:var(--text);color:#fff;font-size:14px;font-weight:900;border:none;border-radius:10px;cursor:pointer;transition:all .2s}
.dbtn:hover{background:var(--np)}
.dbtn:disabled{opacity:.5;cursor:not-allowed}
.dnote{font-size:12px;color:var(--muted);margin-top:12px;font-weight:600}
.dres{margin-top:16px;padding:14px;border-radius:10px;font-size:13px;font-weight:700;display:none}
.dres.ok{background:rgba(57,255,20,.12);border:2px solid var(--ng);color:#1a8a00}
.dres.err{background:rgba(255,45,120,.1);border:2px solid var(--np);color:var(--np)}
/* HOW IT WORKS */
#howitworks{padding:80px 20px;background:var(--bg)}
.steps{max-width:800px;margin:48px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.step{background:var(--white);border:2px solid var(--border);border-radius:16px;padding:22px;text-align:center;position:relative}
.step-num{width:36px;height:36px;border-radius:50%;background:var(--text);color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.step:nth-child(1) .step-num{background:var(--nb)}
.step:nth-child(2) .step-num{background:var(--np)}
.step:nth-child(3) .step-num{background:var(--ng);color:#000}
.step:nth-child(4) .step-num{background:var(--ny);color:#000}
.step-title{font-size:14px;font-weight:800;margin-bottom:6px}
.step-desc{font-size:12px;color:var(--muted);font-weight:500;line-height:1.5}
/* SHIPPING SECTION */
#shipping{padding:80px 20px;background:linear-gradient(135deg,#0d1424 0%,#1a1040 100%);position:relative;overflow:hidden}
.ship-inner{max-width:1100px;margin:0 auto;position:relative;z-index:2}
.ship-blob1{position:absolute;width:400px;height:300px;background:rgba(108,71,255,.18);border-radius:50%;top:-80px;right:-80px;filter:blur(60px);pointer-events:none}
.ship-blob2{position:absolute;width:300px;height:250px;background:rgba(255,45,120,.12);border-radius:50%;bottom:-60px;left:-60px;filter:blur(50px);pointer-events:none}
.ship-flow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:52px}
.ship-step{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:14px 20px;text-align:center;min-width:130px}
.ship-step.active{background:rgba(108,71,255,.3);border-color:rgba(108,71,255,.6)}
.ship-step-ico{font-size:22px;margin-bottom:6px}
